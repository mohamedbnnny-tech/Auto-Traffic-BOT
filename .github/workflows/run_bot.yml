name: Cloud Traffic Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests fpdf

      - name: Run Traffic Bot
        run: python bot.py

      - name: Save generated assets
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@://github.com"
          git add published_links.txt feed.xml pdfs/
          git commit -m "Hourly update: links, RSS feed, and PDFs" || exit 0
          git push
